name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
        env:
          TURBO_CONCURRENCY: "2"
      - name: Slow tests
        if: always()
        continue-on-error: true
        run: node scripts/slow-tests.mjs
      # The only check that loads the built dist/ that npm consumers get.
      - run: pnpm run packed-consumer
      - run: pnpm --filter @house-rules/site build
