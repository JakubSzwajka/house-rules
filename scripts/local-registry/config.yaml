storage: /verdaccio/storage
listen: 0.0.0.0:4873
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 1
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@house-rules/*':
    access: $all
    publish: local
    unpublish: local
    # No proxy: a missing local framework version must not fall back to npm.
  '**':
    access: $all
    proxy: npmjs
log:
  type: stdout
  format: pretty
  level: warn
