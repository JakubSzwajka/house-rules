packages:
  - "apps/*"
  - "packages/*"
  - "examples/*/apps/*"
  - "examples/*/packages/*"
  - "site"

engineStrict: true
saveExact: true
saveWorkspaceProtocol: true

minimumReleaseAge: 1440

packageExtensions:
  "@house-rules/rules":
    dependencies:
      typescript: 6.0.3

allowBuilds:
  "@swc/core": false
  esbuild: false
  lefthook: false
  workerd: false
